# 开发环境部署 — 推送 dev* 标签时构建前端并 rsync 到云服务器 Nginx
name: CD-Dev

on:
  push:
    tags: ['dev*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Deploy to cloud server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TC_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.TC_HOST }}
          REMOTE_USER: ${{ secrets.TC_USER }}
          SOURCE: "dist/"
          TARGET: "/var/www/ipmp/"
